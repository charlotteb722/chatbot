# Netlify settings. Set "Base directory" to projects/charlotte-bjuren-consultancy in the Netlify UI.
[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Keep "preview" until every draft is resolved and Charlotte approves launch.
  # Changing this to "live" makes the build fail if any [DRAFT ...] placeholder remains.
  SITE_MODE = "preview"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
